<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AI Tour Guide - Explore Monuments</title>

		<!-- Leaflet CSS -->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		/>

		<!-- App CSS -->
		<link rel="stylesheet" href="/styles.css" />
	</head>

	<body>
		<div id="app-container">
			<div id="map-section">
				<div id="location-controls">
					<div class="control-group">
					<button id="geolocation-btn" class="location-option">
						<div class="option-icon">📍</div>
						<div class="option-label">My Location</div>
					</button>
				</div>
				<div class="control-group cities-group">
					<div class="select-wrapper">
						<div class="select-icon">🌍</div>
						<select id="cities-select">
							<option value="">Select City</option>
						</select>
					</div>
				</div>
				<div class="control-group">
					<div class="click-map-note">
						<div class="click-map-icon">🗺️</div>
						<div class="click-map-label">Or click Map</div>
					</div>
			</div>
				</div>
				<div id="map">
					<div id="map-loading-indicator">
						<div class="spinner"></div>
						<div id="map-loading-text">Loading monuments...</div>
					</div>
					<div id="map-status-message"></div>
				</div>
			</div>
		</div>

		<div id="chat-interface">
			<div class="chat-header">
				<div>
					<h2 id="chat-monument-name">Monument</h2>
					<p id="chat-city-name">City</p>
				</div>
				<button class="close-chat-btn" id="close-chat-btn">✕</button>
			</div>
			<div id="chat-messages"></div>
			<div class="chat-input-area">
				<input
					type="text"
					id="chat-input"
					placeholder="Ask about this monument..."
					autocomplete="off"
				/>
				<button id="send-btn">➤</button>
			</div>
		</div>

		<!-- Leaflet JS -->
		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		></script>

		<!-- App JavaScript -->
		<script src="/app.js"></script>
	</body>
</html>

<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AI Tour Guide - Explore Monuments</title>

		<!-- Leaflet CSS -->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		/>

		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				height: 100vh;
				overflow: hidden;
			}

			#app-container {
				display: flex;
				height: 100vh;
				gap: 1rem;
				padding: 1rem;
			}

			#map-section {
				flex: 1;
				display: flex;
				flex-direction: column;
				gap: 1rem;
				min-width: 0;
			}

			#location-controls {
				background: white;
				border-radius: 8px;
				padding: 1rem;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
				display: flex;
				gap: 0.5rem;
				flex-wrap: wrap;
			}

			.control-group {
				display: flex;
				gap: 0.5rem;
				align-items: center;
				flex: 1;
				min-width: 200px;
			}

			button {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
				border: none;
				padding: 0.75rem 1.25rem;
				border-radius: 6px;
				cursor: pointer;
				font-size: 0.95rem;
				font-weight: 500;
				transition: transform 0.2s, box-shadow 0.2s;
				white-space: nowrap;
			}

			button:hover {
				transform: translateY(-2px);
				box-shadow: 0 6px 12px rgba(102, 126, 234, 0.4);
			}

			button:active {
				transform: translateY(0);
			}

			select {
				padding: 0.75rem 1rem;
				border: 2px solid #e0e0e0;
				border-radius: 6px;
				font-size: 0.95rem;
				cursor: pointer;
				background: white;
				flex: 1;
				min-width: 150px;
			}

			select:focus {
				outline: none;
				border-color: #667eea;
			}

			#map {
				flex: 1;
				min-height: 0;
				border-radius: 8px;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
				overflow: hidden;
			}

			#chat-interface {
				position: fixed;
				right: 1rem;
				bottom: 1rem;
				width: 400px;
				height: 600px;
				background: white;
				border-radius: 12px;
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
				display: flex;
				flex-direction: column;
				z-index: 1000;
				visibility: hidden;
				opacity: 0;
				transform: translateY(20px);
				transition: all 0.3s ease;
			}

			#chat-interface.active {
				visibility: visible;
				opacity: 1;
				transform: translateY(0);
			}

			.chat-header {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
				padding: 1.5rem 1rem;
				border-radius: 12px 12px 0 0;
				display: flex;
				justify-content: space-between;
				align-items: center;
				min-height: 60px;
			}

			.chat-header h2 {
				font-size: 1.1rem;
				font-weight: 600;
			}

			.chat-header p {
				font-size: 0.85rem;
				opacity: 0.9;
				margin-top: 0.25rem;
			}

			.close-chat-btn {
				background: rgba(255, 255, 255, 0.2);
				border: none;
				color: white;
				width: 32px;
				height: 32px;
				border-radius: 50%;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 1.2rem;
				padding: 0;
				margin-left: auto;
			}

			.close-chat-btn:hover {
				background: rgba(255, 255, 255, 0.3);
				transform: none;
			}

			#chat-messages {
				flex: 1;
				overflow-y: auto;
				padding: 1rem;
				display: flex;
				flex-direction: column;
				gap: 0.75rem;
			}

			.message {
				display: flex;
				gap: 0.75rem;
				animation: slideIn 0.3s ease;
			}

			@keyframes slideIn {
				from {
					opacity: 0;
					transform: translateY(10px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			.message.user {
				justify-content: flex-end;
			}

			.message-content {
				max-width: 80%;
				padding: 0.75rem 1rem;
				border-radius: 12px;
				word-wrap: break-word;
				font-size: 0.95rem;
				line-height: 1.4;
			}

			.message.user .message-content {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
				border-bottom-right-radius: 4px;
			}

			.message.assistant .message-content {
				background: #f0f0f0;
				color: #333;
				border-bottom-left-radius: 4px;
			}

			.chat-input-area {
				padding: 1rem;
				border-top: 1px solid #e0e0e0;
				display: flex;
				gap: 0.5rem;
			}

			#chat-input {
				flex: 1;
				border: 1px solid #e0e0e0;
				border-radius: 6px;
				padding: 0.75rem;
				font-size: 0.95rem;
				font-family: inherit;
				resize: none;
				max-height: 80px;
			}

			#chat-input:focus {
				outline: none;
				border-color: #667eea;
				box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
			}

			#send-btn {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
				border: none;
				width: 40px;
				height: 40px;
				border-radius: 6px;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 1.2rem;
				padding: 0;
				flex-shrink: 0;
			}

			#send-btn:hover {
				transform: translateY(-2px);
				box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
			}

			#send-btn:disabled {
				opacity: 0.5;
				cursor: not-allowed;
				transform: none;
			}

			.loading-indicator {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				color: #999;
				font-size: 0.85rem;
				padding: 0.5rem;
			}

			.spinner {
				width: 16px;
				height: 16px;
				border: 2px solid #f3f3f3;
				border-top: 2px solid #667eea;
				border-radius: 50%;
				animation: spin 1s linear infinite;
			}

			@keyframes spin {
				0% { transform: rotate(0deg); }
				100% { transform: rotate(360deg); }
			}

			.status-message {
				background: #f5f5f5;
				padding: 0.75rem;
				border-radius: 6px;
				text-align: center;
				color: #666;
				font-size: 0.9rem;
			}

			@media (max-width: 768px) {
				#app-container {
					flex-direction: column;
				}

				#chat-interface {
					position: fixed;
					width: 90vw;
					height: 70vh;
					right: auto;
					left: 50%;
					transform: translateX(-50%) translateY(20px);
				}

				#chat-interface.active {
					transform: translateX(-50%) translateY(0);
				}
			}
		</style>
	</head>
	<body>
		<div id="app-container">
			<div id="map-section">
				<div id="location-controls">
					<div class="control-group">
						<button id="geolocation-btn">📍 Use My Location</button>
						<span style="color: #999; font-size: 0.9rem;">or click on the map</span>
					</div>
					<div class="control-group">
						<label for="cities-select" style="margin-right: 0.5rem; color: #333; font-weight: 500;">Go to:</label>
						<select id="cities-select">
							<option value="">Select a city...</option>
							<option value="48.8566,2.3522">Paris, France</option>
							<option value="51.5074,-0.1278">London, UK</option>
							<option value="40.7128,-74.0060">New York, USA</option>
							<option value="35.6762,139.6503">Tokyo, Japan</option>
							<option value="48.1351,11.5820">Munich, Germany</option>
							<option value="41.9028,12.4964">Rome, Italy</option>
							<option value="38.7169,-9.1395">Lisbon, Portugal</option>
							<option value="40.4168,-3.7038">Madrid, Spain</option>
						</select>
					</div>
				</div>
				<div id="map"></div>
			</div>
		</div>

		<div id="chat-interface">
			<div class="chat-header">
				<div>
					<h2 id="chat-monument-name">Monument</h2>
					<p id="chat-city-name">City</p>
				</div>
				<button class="close-chat-btn" id="close-chat-btn">✕</button>
			</div>
			<div id="chat-messages"></div>
			<div class="chat-input-area">
				<input
					type="text"
					id="chat-input"
					placeholder="Ask about this monument..."
					autocomplete="off"
				/>
				<button id="send-btn">➤</button>
			</div>
		</div>

		<!-- Leaflet JS -->
		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		></script>

		<!-- App JavaScript -->
		<script src="/app.js"></script>
	</body>
</html>
